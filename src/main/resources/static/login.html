<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - English Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-primary-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <div class="fs-1 text-primary mb-2"><i class="bi bi-person-circle"></i></div>
        <h3 class="fw-bold text-dark">Chào Mừng Quay Lại!</h3>
        <p class="text-muted small">Đăng nhập để tiếp tục hành trình học tập</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label fw-semibold">Email đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control border-start-0" placeholder="admin@gmail.com" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary-gradient w-100 mb-3">Đăng Nhập</button>
    </form>

    <div id="errorMsg" class="alert alert-danger d-none py-2 text-center small"></div>

    <div class="text-center mt-3">
        <span class="text-muted small">Chưa có tài khoản?</span>
        <a href="/register.html" class="fw-bold text-decoration-none text-primary small">Đăng ký ngay</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        })
        .then(async res => {
            const data = await res.json().catch(() => ({ message: "Lỗi kết nối từ server!" }));
            if (!res.ok) {
                throw new Error(data.message || "Tài khoản hoặc mật khẩu không chính xác!");
            }
            return data;
        })
        .then(user => {
            localStorage.setItem('currentUser', JSON.stringify(user));
            window.location.href = '/';
        })
        .catch(err => {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerText = err.message;
            errorDiv.classList.remove('d-none');
        });
    });
</script>

</body>
</html>
