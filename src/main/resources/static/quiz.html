<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Làm Bài Trắc Nghiệm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="header-container"></div>

<div class="container py-5">
    <a id="btn-back" href="/" class="btn btn-outline-secondary rounded-pill btn-sm mb-3">&leftarrow; Quay lại</a>
    <h2 class="mb-1 text-success fw-bold" id="quiz-title">Luyện Tập Trắc Nghiệm</h2>
    <p class="text-muted small mb-4" id="quiz-subtitle">Kiểm tra kiến thức từ vựng</p>
    <div id="quiz-list"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const topicId = urlParams.get('topicId');

    if (topicId) {
        fetch(`/api/topics/${topicId}`)
            .then(res => res.json())
            .then(t => {
                if (t.title) document.getElementById('quiz-title').innerText = `Bài Tập: ${t.title}`;
                if (t.folderName) document.getElementById('quiz-subtitle').innerText = `Thư mục: ${t.folderName}`;
                if (t.folderId) document.getElementById('btn-back').href = `/?folderId=${t.folderId}`;
            })
            .catch(console.error);
    }

    fetch(`/api/quizzes/topic/${topicId}`)
        .then(res => res.json())
        .then(quizzes => {
            let html = '';
            quizzes.forEach((q, idx) => {
                html += `
                    <div class="card mb-4 shadow-sm">
                        <div class="card-body">
                            <h5>Câu ${idx + 1}: ${q.question}</h5>
                            <div class="mt-3">
                                <button class="btn btn-outline-dark w-100 text-start mb-2" onclick="checkAnswer(this, 'A', '${q.correctOption}')">A. ${q.optionA}</button>
                                <button class="btn btn-outline-dark w-100 text-start mb-2" onclick="checkAnswer(this, 'B', '${q.correctOption}')">B. ${q.optionB}</button>
                                <button class="btn btn-outline-dark w-100 text-start mb-2" onclick="checkAnswer(this, 'C', '${q.correctOption}')">C. ${q.optionC}</button>
                                <button class="btn btn-outline-dark w-100 text-start mb-2" onclick="checkAnswer(this, 'D', '${q.correctOption}')">D. ${q.optionD}</button>
                            </div>
                            <div class="result mt-2 fw-bold"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('quiz-list').innerHTML = html;
        });

    function checkAnswer(btn, selected, correct) {
        const resultDiv = btn.parentElement.nextElementSibling;
        if (selected === correct) {
            resultDiv.className = "result mt-2 fw-bold text-success";
            resultDiv.innerText = "Chính xác! 🎉";
        } else {
            resultDiv.className = "result mt-2 fw-bold text-danger";
            resultDiv.innerText = `Sai rồi! Đáp án đúng là ${correct}`;
        }
    }
</script>

<script src="/js/layout.js"></script>
</body>
</html>
