<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - EnglishPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }
        .btn-success-gradient {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">Tạo Tài Khoản Mới</h3>
        <p class="text-muted small">Đăng ký tài khoản học viên để bắt đầu học tập</p>
    </div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label fw-semibold">Họ và tên</label>
            <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email đăng nhập</label>
            <input type="email" id="email" class="form-control" placeholder="user@gmail.com" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-success-gradient w-100 mb-3">Tạo Tài Khoản</button>
    </form>

    <div id="alertMsg" class="alert d-none py-2 text-center small"></div>

    <div class="text-center mt-3">
        <span class="text-muted small">Đã có tài khoản?</span>
        <a href="/login.html" class="fw-bold text-decoration-none text-primary small">Đăng nhập</a>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const userData = {
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        };

        fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        })
        .then(async res => {
            const data = await res.json().catch(() => ({ message: "Lỗi không xác định từ server!" }));
            if (!res.ok) {
                throw new Error(data.message || "Đăng ký không thành công!");
            }
            return data;
        })
        .then(data => {
            const alertDiv = document.getElementById('alertMsg');
            alertDiv.className = "alert alert-success py-2 text-center small";
            alertDiv.innerText = "Đăng ký thành công! Đang chuyển sang Đăng nhập...";
            alertDiv.classList.remove('d-none');
            setTimeout(() => window.location.href = '/login.html', 1500);
        })
        .catch(err => {
            const alertDiv = document.getElementById('alertMsg');
            alertDiv.className = "alert alert-danger py-2 text-center small";
            alertDiv.innerText = err.message;
            alertDiv.classList.remove('d-none');
        });
    });
</script>

</body>
</html>
