<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Học Liệu & Gói VIP - EnglishPro (Lab 04)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
        }
        .product-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background: #fff;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        .product-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 210px;
        }
        .product-img {
            height: 100%;
            object-fit: cover;
            width: 100%;
            transition: transform 0.4s ease;
            cursor: pointer;
        }
        .product-card:hover .product-img {
            transform: scale(1.08);
        }
        .badge-category {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 2;
        }
        .price-text {
            color: #059669;
            font-size: 1.35rem;
            font-weight: 800;
        }
        .btn-add-cart {
            border-radius: 12px;
            font-weight: 700;
            padding: 10px;
            transition: all 0.2s;
        }
        /* Toast notification */
        #cart-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        #cart-toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="header-container"></div>

<!-- Toast thông báo thêm giỏ hàng thành công -->
<div id="cart-toast" class="alert alert-success shadow-lg rounded-4 d-flex align-items-center gap-3 py-3 px-4 border-0">
    <i class="bi bi-check-circle-fill fs-3 text-success"></i>
    <div>
        <div class="fw-bold" id="toast-title">Đã thêm vào giỏ hàng!</div>
        <small class="text-muted" id="toast-desc">Sản phẩm đã được cập nhật vào giỏ.</small>
    </div>
    <a href="/cart.html" class="btn btn-sm btn-success rounded-pill px-3 fw-bold ms-2">Xem Giỏ</a>
</div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-extrabold text-dark mb-1">
                <i class="bi bi-shop text-primary me-2"></i>Cửa Hàng Học Liệu & Dịch Vụ
            </h2>
            <p class="text-muted mb-0">Hộp Flashcard in thực tế gửi tận nhà & Gói nâng cấp tài khoản số VIP</p>
        </div>
        <div>
            <a href="/cart.html" class="btn btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm">
                <i class="bi bi-cart3 me-2"></i>Xem Giỏ Hàng (<span id="cart-total-qty">0</span>)
            </a>
        </div>
    </div>

    <!-- DANH SÁCH SẢN PHẨM -->
    <div class="row g-4" id="products-grid">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Đang tải danh sách sản phẩm...</p>
        </div>
    </div>
</div>

<script src="/js/layout.js?v=9"></script>
<script src="/js/shop.js?v=1"></script>
</body>
</html>
