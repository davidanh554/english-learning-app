<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Học Liệu & Gói VIP - EnglishPro (Lab 04)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
        }
        .product-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background: #fff;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        .product-img-wrapper {
            position: relative;
            overflow: hidden;
            height: 210px;
        }
        .product-img {
            height: 100%;
            object-fit: cover;
            width: 100%;
            transition: transform 0.4s ease;
            cursor: pointer;
        }
        .product-card:hover .product-img {
            transform: scale(1.08);
        }
        .badge-category {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 2;
        }
        .price-text {
            color: #059669;
            font-size: 1.35rem;
            font-weight: 800;
        }
        .btn-add-cart {
            border-radius: 12px;
            font-weight: 700;
            padding: 10px;
            transition: all 0.2s;
        }
        /* Toast notification */
        #cart-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        #cart-toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="header-container"></div>

<!-- Toast thông báo thêm giỏ hàng thành công -->
<div id="cart-toast" class="alert alert-success shadow-lg rounded-4 d-flex align-items-center gap-3 py-3 px-4 border-0">
    <i class="bi bi-check-circle-fill fs-3 text-success"></i>
    <div>
        <div class="fw-bold" id="toast-title">Đã thêm vào giỏ hàng!</div>
        <small class="text-muted" id="toast-desc">Sản phẩm đã được cập nhật vào giỏ.</small>
    </div>
    <a href="/cart.html" class="btn btn-sm btn-success rounded-pill px-3 fw-bold ms-2">Xem Giỏ</a>
</div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-extrabold text-dark mb-1">
                <i class="bi bi-shop text-primary me-2"></i>Cửa Hàng Học Liệu & Dịch Vụ
            </h2>
            <p class="text-muted mb-0">Hộp Flashcard in thực tế gửi tận nhà & Gói nâng cấp tài khoản số VIP</p>
        </div>
        <div>
            <a href="/cart.html" class="btn btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm">
                <i class="bi bi-cart3 me-2"></i>Xem Giỏ Hàng (<span id="cart-total-qty">0</span>)
            </a>
        </div>
    </div>

    <!-- DANH SÁCH SẢN PHẨM -->
    <div class="row g-4" id="products-grid">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Đang tải danh sách sản phẩm...</p>
        </div>
    </div>
</div>

<script src="/js/layout.js?v=9"></script>
<script>
    function formatCurrency(amount) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    // Tải danh sách sản phẩm
    function loadProducts() {
        fetch('/api/products')
            .then(res => res.json())
            .then(products => {
                const grid = document.getElementById('products-grid');
                if (products.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">Chưa có sản phẩm nào!</div>';
                    return;
                }

                grid.innerHTML = products.map(p => {
                    const badgeClass = p.physical ? 'text-primary' : 'text-danger';
                    const typeIcon = p.physical ? '<i class="bi bi-box-seam me-1"></i>Hàng vật lý' : '<i class="bi bi-lightning-charge-fill me-1"></i>Kích hoạt tức thì';

                    return `
                        <div class="col-md-6 col-lg-3">
                            <div class="product-card position-relative">
                                <span class="badge-category ${badgeClass}">
                                    ${p.category || 'Học liệu'}
                                </span>
                                <div class="product-img-wrapper">
                                    <a href="/product-detail.html?id=${p.id}" title="Bấm xem chi tiết ${p.name}">
                                        <img src="${p.imageUrl}" alt="${p.name}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=500&auto=format&fit=crop&q=60'">
                                    </a>
                                </div>
                                <div class="p-3 d-flex flex-column flex-grow-1">
                                    <small class="text-muted mb-1">${typeIcon}</small>
                                    <h5 class="fw-bold mb-2" style="font-size: 1.05rem; min-height: 48px;">
                                        <a href="/product-detail.html?id=${p.id}" class="text-dark text-decoration-none" title="Xem chi tiết">
                                            ${p.name}
                                        </a>
                                    </h5>
                                    <p class="text-muted small mb-3 flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                                        ${p.description}
                                    </p>
                                    <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                                        <div class="price-text">${formatCurrency(p.price)}</div>
                                        <small class="text-muted">${p.stockQuantity > 0 ? '<span class="text-success"><i class="bi bi-check-circle me-1"></i>Còn hàng</span>' : '<span class="text-danger">Hết hàng</span>'}</small>
                                    </div>
                                    <div class="row g-2 mt-3">
                                        <div class="col-6">
                                            <button class="btn btn-outline-primary w-100 py-2 fw-bold rounded-pill text-nowrap btn-sm" onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}')" title="Thêm vào giỏ hàng">
                                                <i class="bi bi-cart-plus me-1"></i>Thêm giỏ
                                            </button>
                                        </div>
                                        <div class="col-6">
                                            <button class="btn btn-warning w-100 py-2 fw-bold rounded-pill text-dark text-nowrap shadow-sm btn-sm" onclick="buyNow(${p.id}, '${p.name.replace(/'/g, "\\'")}')" title="Mua ngay và tới giỏ hàng">
                                                <i class="bi bi-lightning-charge-fill me-1"></i>Mua ngay
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            })
            .catch(console.error);
    }

    // Thêm vào giỏ hàng qua API POST /api/cart/add
    function addToCart(productId, productName) {
        fetch('/api/cart/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId: productId, quantity: 1 })
        })
        .then(res => res.json())
        .then(cart => {
            updateCartHeader(cart);
            showCartToast(productName);
        })
        .catch(err => {
            alert("Có lỗi khi thêm vào giỏ hàng: " + err.message);
        });
    }

    // Mua ngay: Thêm vào giỏ hàng và chuyển hướng ngay tới giỏ hàng
    function buyNow(productId, productName) {
        fetch('/api/cart/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId: productId, quantity: 1 })
        })
        .then(res => res.json())
        .then(() => {
            window.location.href = '/cart.html';
        })
        .catch(err => {
            alert("Có lỗi khi mua ngay: " + err.message);
        });
    }

    function updateCartHeader(cart) {
        const totalQty = cart.totalQuantity || 0;
        document.getElementById('cart-total-qty').innerText = totalQty;
        const navBadge = document.getElementById('nav-cart-badge');
        if (navBadge) navBadge.innerText = totalQty;
    }

    let toastTimer;
    function showCartToast(name) {
        const toast = document.getElementById('cart-toast');
        document.getElementById('toast-title').innerText = "Đã thêm vào giỏ hàng!";
        document.getElementById('toast-desc').innerText = name;
        toast.classList.add('show');

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    loadProducts();
    // Tải số lượng ban đầu của giỏ
    fetch('/api/cart').then(r => r.json()).then(updateCartHeader).catch(()=>{});
</script>

</body>
</html>
