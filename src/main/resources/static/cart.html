<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng Của Bạn - EnglishPro (Lab 04)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }
        .cart-table th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 700;
            border: none;
            padding: 14px;
        }
        .cart-table td {
            vertical-align: middle;
            padding: 16px 14px;
        }
        .form-check-input {
            cursor: pointer;
            width: 1.25em;
            height: 1.25em;
        }
        .form-check-input:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .qty-input {
            width: 65px;
            text-align: center;
            border-radius: 8px;
            font-weight: 700;
        }
        .qty-step-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #fff;
            transition: all 0.2s;
        }
        .qty-step-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .product-thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 14px;
            transition: transform 0.2s;
        }
        .product-thumb:hover {
            transform: scale(1.05);
        }
        .summary-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            background: #fff;
        }
    </style>
</head>
<body>

<div id="header-container"></div>

<div class="container py-5" style="max-width: 1100px;">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-extrabold text-dark mb-1">
                <i class="bi bi-cart3 text-primary me-2"></i>Giỏ Hàng Của Bạn
            </h2>
            <small class="text-muted">Chọn các sản phẩm cần thanh toán và tính tiền đơn hàng theo chuẩn Lab 04</small>
        </div>
        <a href="/shop.html" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">
            <i class="bi bi-arrow-left me-1"></i> Tiếp tục mua sắm
        </a>
    </div>

    <!-- KHU VỰC BẢNG GIỎ HÀNG (LAB 04) -->
    <div id="cart-content">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Đang tải giỏ hàng...</p>
        </div>
    </div>
</div>

<script src="/js/layout.js?v=10"></script>
<script src="/js/cart.js?v=2"></script>
</body>
</html>
