<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Học Flashcard - EnglishPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
        }

        /* Thẻ Flashcard 3D */
        .scene {
            width: 100%;
            max-width: 550px;
            height: 360px;
            perspective: 1000px;
            margin: 0 auto;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border: 2px solid #e2e8f0;
        }

        .card-face-back {
            transform: rotateY(180deg);
            background: #f8fafc;
        }

        .progress-bar-custom {
            height: 12px;
            border-radius: 6px;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            width: 0%;
            transition: width 0.3s ease;
        }

        .info-tag {
            background: #ffffff;
            border-left: 4px solid #3b82f6;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.88rem;
            width: 100%;
            text-align: left;
            margin-top: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
    </style>
</head>
<body>

<div id="header-container"></div>

<div class="container py-4" style="max-width: 700px;">
    <!-- HEADER & ĐIỀU HƯỚNG -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a id="back-link" href="#" class="btn btn-outline-secondary rounded-pill btn-sm">
            <i class="bi bi-arrow-left"></i> Danh Sách Từ Vựng
        </a>
        <span class="fw-bold text-primary fs-5" id="card-index">0 / 0</span>
    </div>

    <!-- THANH TIẾN ĐỘ HỌC THUỘC -->
    <div class="card p-3 border-0 shadow-sm rounded-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1 fs-6">
            <span class="fw-bold text-dark"><i class="bi bi-trophy text-warning me-1"></i> Tiến độ thuộc chủ đề:</span>
            <span class="fw-bold text-success" id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-custom">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="text-end text-muted small mt-1" id="progress-text">Đã thuộc 0 / 0 từ</div>
    </div>

    <!-- KHU VỰC THẺ FLASHCARD -->
    <div id="flashcard-container">
        <div class="scene" onclick="flipCard()">
            <div class="card-inner" id="flashcard">
                <!-- MẶT TRƯỚC -->
                <div class="card-face">
                    <span class="badge bg-primary-subtle text-primary fw-bold rounded-pill mb-2 px-3 py-2" id="loai-tu">Vocabulary</span>
                    <h1 class="display-4 fw-extrabold text-dark my-2" id="word-text">Word</h1>
                    <p class="fs-5 text-muted fst-italic mb-3" id="phien-am">/phien am/</p>
                    <div class="d-flex gap-2" onclick="event.stopPropagation()">
                        <button class="btn btn-light border rounded-pill px-3 fw-semibold text-danger" id="btn-us">🇺🇸 US</button>
                        <button class="btn btn-light border rounded-pill px-3 fw-semibold text-primary" id="btn-uk">🇬🇧 UK</button>
                    </div>
                    <small class="text-muted mt-4"><i class="bi bi-hand-index-thumb me-1"></i> Bấm để xem nghĩa</small>
                </div>

                <!-- MẶT SAU -->
                <div class="card-face card-face-back">
                    <h2 class="fw-bold text-success mb-2" id="meaning-text">Nghĩa Tiếng Việt</h2>
                    <div id="extra-info" class="w-100 overflow-auto" style="max-height: 200px;"></div>
                    <small class="text-muted mt-3"><i class="bi bi-arrow-repeat me-1"></i> Bấm để lật lại mặt trước</small>
                </div>
            </div>
        </div>

        <!-- 3 NÚT THAO TÁC -->
        <div class="d-flex justify-content-center align-items-center gap-2 gap-md-3 mt-4">
            <button id="btn-prev" class="btn btn-outline-secondary btn-lg rounded-pill px-3 px-md-4 fw-bold shadow-sm" onclick="prevCard()" disabled>
                <i class="bi bi-arrow-left-circle me-1"></i> Từ trước
            </button>

            <button class="btn btn-outline-danger btn-lg rounded-pill px-3 px-md-4 fw-bold shadow-sm" onclick="markVocabulary(false)">
                <i class="bi bi-x-circle-fill me-1"></i> Chưa thuộc
            </button>

            <button class="btn btn-success btn-lg rounded-pill px-3 px-md-4 fw-bold shadow-sm" onclick="markVocabulary(true)">
                <i class="bi bi-check-circle-fill me-1"></i> Đã thuộc
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH HOÀN THÀNH CHỦ ĐỀ -->
    <div id="completion-screen" class="card border-0 shadow p-5 text-center rounded-4 d-none">
        <div class="display-1 text-warning mb-3">🎉</div>
        <h2 class="fw-bold text-dark">Chúc mừng bạn!</h2>
        <p class="lead text-secondary" id="completion-desc">Bạn đã xem hết tất cả từ vựng trong chủ đề này.</p>

        <div class="d-flex justify-content-center flex-wrap gap-2 mt-4" id="completion-actions">
            <!-- Nút bấm dynamic JS -->
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const topicId = urlParams.get('topicId') || 1;
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('user') || '{}');
    const userId = currentUser.id || 1;

    document.getElementById('back-link').href = `/vocabulary.html?topicId=${topicId}`;

    // Tải tên File và Thư mục
    fetch(`/api/topics/${topicId}`)
        .then(res => res.json())
        .then(t => {
            if (t.title) {
                const prefix = t.folderName ? `[${t.folderName}] ` : '';
                document.getElementById('topic-display-title').innerHTML = `<i class="bi bi-trophy text-warning me-1"></i> ${prefix}<strong>${t.title}</strong>:`;
            }
        })
        .catch(console.error);
    let vocabList = [];         // Danh sách từ vựng đang học (có thể đã qua lọc)
    let progressMap = {};
    let currentIndex = 0;

    // 1. Tải danh sách từ vựng & tiến độ học của User
    Promise.all([
        fetch(`/api/vocabularies/topic/${topicId}`).then(r => r.json()),
        fetch(`/api/progress/topic/${topicId}/user/${userId}`).then(r => r.json())
    ]).then(([vocabs, progressList]) => {
        originalVocabList = vocabs.filter(v => !v.word.toLowerCase().includes('topic 7') && v.word.toLowerCase() !== 'word');
        vocabList = [...originalVocabList];

        progressList.forEach(p => {
            progressMap[p.vocabularyId] = p.mastered;
        });

        if (vocabList.length > 0) {
            updateProgressHeader();
            renderCard();
        } else {
            alert('Chủ đề này chưa có từ vựng nào!');
        }
    });

    // 2. Hiển thị thông tin thẻ hiện tại
    function renderCard() {
        if (currentIndex >= vocabList.length) {
            showCompletion();
            return;
        }

        document.getElementById('flashcard-container').classList.remove('d-none');
        document.getElementById('completion-screen').classList.add('d-none');
        document.getElementById('btn-prev').disabled = (currentIndex === 0);

        const item = vocabList[currentIndex];
        document.getElementById('flashcard').classList.remove('is-flipped');

        document.getElementById('card-index').innerText = `${currentIndex + 1} / ${vocabList.length}`;
        document.getElementById('word-text').innerText = item.word;
        document.getElementById('phien-am').innerText = item.phienAm || '';
        document.getElementById('loai-tu').innerText = item.loaiTu || 'Vocabulary';
        document.getElementById('meaning-text').innerText = item.meaning || '';

        document.getElementById('btn-us').onclick = (e) => { e.stopPropagation(); playAudio(item.audioUs, item.word, 'en-US'); };
        document.getElementById('btn-uk').onclick = (e) => { e.stopPropagation(); playAudio(item.audioUk, item.word, 'en-GB'); };

        let extraHtml = '';
        if (item.wordForms) {
            extraHtml += `<div class="info-tag"><strong class="text-primary">Biến thể:</strong> ${item.wordForms}</div>`;
        }
        if (item.paraphrase) {
            extraHtml += `<div class="info-tag" style="border-left-color: #06b6d4;"><strong class="text-info">Paraphrase:</strong> ${item.paraphrase}</div>`;
        }
        if (item.collocationExample || item.example) {
            extraHtml += `<div class="info-tag" style="border-left-color: #10b981;"><strong class="text-success">Cụm từ & Ví dụ:</strong> ${item.collocationExample || item.example}</div>`;
        }
        document.getElementById('extra-info').innerHTML = extraHtml;
    }

    // 3. Lật thẻ 3D
    function flipCard() {
        document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    // 4. Bấm "Đã thuộc" hoặc "Chưa thuộc"
    function markVocabulary(isMastered) {
        const item = vocabList[currentIndex];
        progressMap[item.id] = isMastered;

        fetch('/api/progress/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: userId,
                vocabularyId: item.id,
                topicId: parseInt(topicId),
                mastered: isMastered
            })
        });

        updateProgressHeader();
        currentIndex++;
        renderCard();
    }

    // 5. Nút LÙI LẠI TỪ TRƯỚC
    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        }
    }

    // 6. Cập nhật thanh % tiến độ dựa trên danh sách gốc
    function updateProgressHeader() {
        const total = originalVocabList.length;
        const masteredCount = originalVocabList.filter(v => progressMap[v.id] === true).length;
        const percent = total > 0 ? Math.round((masteredCount / total) * 100) : 0;

        document.getElementById('progress-percent').innerText = `${percent}%`;
        document.getElementById('progress-fill').style.width = `${percent}%`;
        document.getElementById('progress-text').innerText = `Đã thuộc ${masteredCount} / ${total} từ`;
    }

    // 7. Màn hình hoàn thành
    function showCompletion() {
        document.getElementById('flashcard-container').classList.add('d-none');
        document.getElementById('completion-screen').classList.remove('d-none');

        const total = originalVocabList.length;
        const unmasteredCount = originalVocabList.filter(v => !progressMap[v.id]).length;
        const masteredCount = total - unmasteredCount;

        const actionContainer = document.getElementById('completion-actions');

        if (unmasteredCount === 0) {
            document.getElementById('completion-desc').innerHTML =
                `<strong class="text-success">Tuyệt vời! Bạn đã thuộc toàn bộ ${total}/${total} từ vựng trong chủ đề này! 🏆</strong>`;

            actionContainer.innerHTML = `
                <button class="btn btn-primary rounded-pill px-4 py-2 fw-bold" onclick="reviewAll()">
                    <i class="bi bi-arrow-repeat me-1"></i> Ôn lại tất cả
                </button>
                <button class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold" onclick="resetTopicProgress()">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Học lại từ 0%
                </button>
            `;
        } else {
            document.getElementById('completion-desc').innerHTML =
                `Bạn đã thuộc <strong>${masteredCount}/${total}</strong> từ. Còn <strong>${unmasteredCount}</strong> từ chưa thuộc.`;

            actionContainer.innerHTML = `
                <button class="btn btn-warning text-dark rounded-pill px-4 py-2 fw-bold" onclick="reviewUnmasteredOnly()">
                    🎯 Chỉ ôn ${unmasteredCount} từ chưa thuộc
                </button>
                <button class="btn btn-outline-primary rounded-pill px-4 py-2 fw-bold" onclick="reviewAll()">
                    🔄 Ôn lại tất cả (${total} từ)
                </button>
            `;
        }
    }

    // 8. Các hàm điều hướng học lại
    function reviewUnmasteredOnly() {
        vocabList = originalVocabList.filter(v => !progressMap[v.id]);
        currentIndex = 0;
        renderCard();
    }

    function reviewAll() {
        vocabList = [...originalVocabList];
        currentIndex = 0;
        renderCard();
    }

    function resetTopicProgress() {
        if (confirm("Bạn có chắc muốn đặt lại tiến độ bài học này về 0%?")) {
            originalVocabList.forEach(v => {
                progressMap[v.id] = false;
                fetch('/api/progress/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        vocabularyId: v.id,
                        topicId: parseInt(topicId),
                        mastered: false
                    })
                });
            });
            vocabList = [...originalVocabList];
            currentIndex = 0;
            updateProgressHeader();
            renderCard();
        }
    }

    function playAudio(audioUrl, word, lang) {
        if (audioUrl && audioUrl !== 'null' && audioUrl.trim() !== '') {
            new Audio(audioUrl).play().catch(() => playSpeechFallback(word, lang));
        } else {
            playSpeechFallback(word, lang);
        }
    }

    function playSpeechFallback(word, lang) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = lang;
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

<script src="/js/layout.js"></script>

</body>
</html>
