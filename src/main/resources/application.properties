server.port=8082

# Tự động nạp cấu hình bí mật cục bộ (nếu có trên máy)
# File application-secret.properties không bị đẩy lên Git
spring.config.import=optional:classpath:application-secret.properties

spring.datasource.url=jdbc:mysql://localhost:3306/english_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Giá trị an toàn khi push lên GitHub (ưu tiên lấy từ application-secret.properties hoặc biến môi trường GEMINI_API_KEY)
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
